<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Academic Course Portal | CSE Resources</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --primary: #38bdf8;
            --secondary: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --pdf-color: #ef4444;
            --ppt-color: #f97316;
            --book-color: #10b981;
            --ques-color: #a855f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 2.5rem 1.5rem;
            text-align: center;
        }

        .header-content {
            max-width: 1100px;
            margin: 0 auto;
        }

        .badge-header {
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 10px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .controls-container {
            max-width: 1150px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .search-box {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .main-container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .loading-box {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.2rem;
        }

        .file-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
        }

        .file-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .file-top {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 1rem;
        }

        .file-icon {
            font-size: 1.8rem;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-pdf { color: var(--pdf-color); }
        .icon-ppt { color: var(--ppt-color); }
        .icon-file { color: var(--primary); }

        .file-info h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
            word-break: break-word;
        }

        .category-tag {
            display: inline-block;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
        }

        .file-actions {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-type-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .open-btn {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .open-btn:hover {
            background: var(--primary);
            color: #0f172a;
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <span class="badge-header"><i class="fa-solid fa-rotate"></i> Real-Time Google Drive Sync</span>
            <h1>Live Academic Course Portal</h1>
            <p>Automatically fetches files directly from your Google Drive folder</p>
        </div>
    </header>

    <div class="controls-container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search live files...">
        </div>
    </div>

    <div class="main-container" id="coursesContainer">
        <div class="loading-box">
            <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
            <p style="margin-top: 10px;">Connecting to Google Drive and fetching files...</p>
        </div>
    </div>

    <footer>
        <p>Built for Parves Hasan | Department of CSE, Daffodil International University</p>
    </footer>

    <script>
        // আপনার গুগল ড্রাইভ ফোল্ডারের আইডি
        const FOLDER_ID = '1kAVmMEKiiwi4JldUaAUIsykXA4IkzT9A';
        // এখানে আপনার Google Cloud Console থেকে প্রাপ্ত API Key বসাতে হবে
        const API_KEY = 'YOUR_GOOGLE_DRIVE_API_KEY'; 

        async function fetchDriveFiles() {
            if (API_KEY === 'YOUR_GOOGLE_DRIVE_API_KEY') {
                document.getElementById('coursesContainer').innerHTML = `
                    <div style="text-align:center; padding: 3rem; background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border-color);">
                        <i class="fa-solid fa-triangle-exclamation fa-2x" style="color: #f59e0b; margin-bottom: 1rem;"></i>
                        <h3 style="margin-bottom: 0.5rem;">API Key Required for Real-Time Sync</h3>
                        <p style="color: var(--text-muted);">Google Drive API ব্যবহার করতে কোডের ভেতরে আপনার জেনারেট করা API Key বসাতে হবে। অথবা গুগল শিট (Google Sheets) পদ্ধতি ব্যবহার করতে পারেন যা সবচেয়ে সহজ ও ঝামেলাহীন!</p>
                    </div>
                `;
                return;
            }

            const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents&key=${API_KEY}&fields=files(id,name,mimeType,webViewLink)`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if(data.files) {
                    renderFiles(data.files);
                } else {
                    document.getElementById('coursesContainer').innerHTML = `<p style="text-align:center; color: var(--text-muted);">No files found or check folder permissions ("Anyone with the link can view").</p>`;
                }
            } catch (error) {
                console.error('Error fetching drive files:', error);
            }
        }

        function renderFiles(files) {
            const container = document.getElementById('coursesContainer');
            let cardsHTML = '';

            files.forEach(file => {
                let icon = "fa-file icon-file";
                let type = "Document";
                if(file.mimeType.includes('pdf')) { icon = "fa-file-pdf icon-pdf"; type = "PDF"; }
                else if(file.mimeType.includes('presentation')) { icon = "fa-file-powerpoint icon-ppt"; type = "Presentation"; }

                cardsHTML += `
                    <div class="file-card">
                        <div class="file-top">
                            <div class="file-icon"><i class="fa-solid ${icon}"></i></div>
                            <div class="file-info">
                                <h3>${file.name}</h3>
                                <span class="category-tag">Google Drive Live</span>
                            </div>
                        </div>
                        <div class="file-actions">
                            <span class="file-type-label"><i class="fa-regular fa-file"></i> ${type}</span>
                            <a href="${file.webViewLink}" target="_blank" class="open-btn">
                                Open File <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            </a>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = `<div class="grid">${cardsHTML}</div>`;
        }

        fetchDriveFiles();
    </script>
</body>
</html>
