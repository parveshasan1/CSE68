<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Course Portal | CSE Resources</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --primary: #38bdf8;
            --secondary: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --pdf-color: #ef4444;
            --ppt-color: #f97316;
            --book-color: #10b981;
            --ques-color: #a855f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        /* Header Styles */
        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 2.5rem 1.5rem;
            text-align: center;
        }

        .header-content {
            max-width: 1100px;
            margin: 0 auto;
        }

        .badge-header {
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 10px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Search & Navigation */
        .controls-container {
            max-width: 1150px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .search-box {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            background: var(--card-hover);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        /* Main Content Grid */
        .main-container {
            max-width: 1150px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .course-section {
            margin-bottom: 3rem;
        }

        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .course-title {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .course-code {
            background: rgba(129, 140, 248, 0.15);
            color: var(--secondary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.2rem;
        }

        /* File Card */
        .file-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
        }

        .file-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .file-top {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 1rem;
        }

        .file-icon {
            font-size: 1.8rem;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-pdf { color: var(--pdf-color); }
        .icon-ppt { color: var(--ppt-color); }
        .icon-book { color: var(--book-color); }
        .icon-ques { color: var(--ques-color); }

        .file-info h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
            word-break: break-word;
        }

        .category-tag {
            display: inline-block;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-muted);
        }

        .tag-mid { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
        .tag-book { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .tag-practice { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .tag-ques { background: rgba(168, 85, 247, 0.15); color: #c084fc; }

        .file-actions {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-type-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .open-btn {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .open-btn:hover {
            background: var(--primary);
            color: #0f172a;
        }

        footer {
            text-align: center;
            margin-top: 4rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.7rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

                files: [
                    { name: "CSE224 Official Lab Manual", category: "Lab Manual", type: "PDF", icon: "fa-book-open icon-book", tagClass: "tag-book", url: "https://drive.google.com/file/d/1rMU-7GjmZ_qr43X8boDQF-C-4CMmoGVO/view" },
                    { name: "Full Lab Report (Experiments 1 - 8)", category: "Lab Report", type: "PDF", icon: "fa-file-pdf icon-pdf", tagClass: "tag-mid", url: "https://drive.google.com/file/d/1psKUpRnYjaZZ9RdWPpv2t4xm-AcdfYDJ/view" }
                ]
            }
        ];

        let currentFilter = 'all';

        function renderCourses(searchQuery = '') {
            const container = document.getElementById('coursesContainer');
            container.innerHTML = '';

            coursesData.forEach(course => {
                if (currentFilter !== 'all' && course.code !== currentFilter) return;

                const filteredFiles = course.files.filter(file => 
                    file.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    file.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    course.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    course.code.toLowerCase().includes(searchQuery.toLowerCase())
                );

                if (filteredFiles.length === 0) return;

                const section = document.createElement('div');
                section.className = 'course-section';

                let cardsHTML = '';
                filteredFiles.forEach(file => {
                    cardsHTML += `
                        <div class="file-card">
                            <div class="file-top">
                                <div class="file-icon">
                                    <i class="fa-solid ${file.icon}"></i>
                                </div>
                                <div class="file-info">
                                    <h3>${file.name}</h3>
                                    <span class="category-tag ${file.tagClass}">${file.category}</span>
                                </div>
                            </div>
                            <div class="file-actions">
                                <span class="file-type-label"><i class="fa-regular fa-file"></i> ${file.type} Document</span>
                                <a href="${file.url}" target="_blank" class="open-btn">
                                    Open File <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                </a>
                            </div>
                        </div>
                    `;
                });

                section.innerHTML = `
                    <div class="course-header">
                        <div class="course-title">
                            <i class="fa-solid ${course.icon}" style="color: var(--primary);"></i>
                            ${course.title}
                        </div>
                        <span class="course-code">${course.code} (${filteredFiles.length} Files)</span>
                    </div>
                    <div class="grid">
                        ${cardsHTML}
                    </div>
                `;

                container.appendChild(section);
            });

            if (container.innerHTML === '') {
                container.innerHTML = `<p style="text-align:center; color: var(--text-muted); padding: 2rem;">No matching files found for "${searchQuery}".</p>`;
            }
        }

        function filterCourse(code) {
            currentFilter = code;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderCourses(document.getElementById('searchInput').value);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderCourses(e.target.value);
        });

        // Initial Render
        renderCourses();
    </script>
</body>
</html>
