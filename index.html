<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIU CSE 68_F | Academic Resource Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root[data-theme="dark"] {
            --bg-body: #090d16;
            --bg-sidebar: #0f1523;
            --bg-surface: #131b2e;
            --bg-surface-hover: #1a243d;
            --bg-elevated: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-subtle: rgba(255, 255, 255, 0.07);
            --border-focus: #6366f1;
            --accent-primary: #6366f1;
            --accent-primary-hover: #4f46e5;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --accent-purple: #a855f7;
            --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        :root[data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-sidebar: #ffffff;
            --bg-surface: #ffffff;
            --bg-surface-hover: #f8fafc;
            --bg-elevated: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-subtle: #e2e8f0;
            --border-focus: #4f46e5;
            --accent-primary: #4f46e5;
            --accent-primary-hover: #4338ca;
            --accent-emerald: #059669;
            --accent-amber: #d97706;
            --accent-rose: #e11d48;
            --accent-purple: #9333ea;
            --shadow-card: 0 4px 20px -5px rgba(15, 23, 42, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 270px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 1.5rem 1rem;
            transition: transform 0.3s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 0.75rem 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 1.25rem;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent-primary), #818cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
        }

        .brand-text h2 {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .brand-text span {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .nav-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 700;
            padding: 0 0.75rem;
            margin: 1rem 0 0.5rem;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .nav-item:hover {
            background-color: var(--bg-surface-hover);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: rgba(99, 102, 241, 0.12);
            color: var(--accent-primary);
            border-color: rgba(99, 102, 241, 0.25);
        }

        .nav-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-badge {
            font-size: 0.72rem;
            background-color: var(--bg-elevated);
            color: var(--text-secondary);
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 700;
        }

        .nav-item.active .nav-badge {
            background-color: var(--accent-primary);
            color: #fff;
        }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border-subtle);
        }

        .developer-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.8rem;
        }

        .developer-card p {
            color: var(--text-secondary);
            font-size: 0.75rem;
            margin-top: 2px;
        }

        /* Main Workspace */
        .main-wrapper {
            flex: 1;
            margin-left: 270px;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* Topbar */
        .topbar {
            height: 72px;
            background-color: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            position: sticky;
            top: 0;
            z-index: 90;
            gap: 1rem;
        }

        .mobile-toggle {
            display: none;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            max-width: 520px;
        }

        .search-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .search-wrapper input {
            width: 100%;
            padding: 10px 16px 10px 42px;
            background-color: var(--bg-body);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.88rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-wrapper input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            height: 40px;
            padding: 0 14px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .icon-btn:hover {
            border-color: var(--accent-primary);
            background-color: var(--bg-surface-hover);
        }

        /* Content Area */
        .content {
            padding: 2rem;
            max-width: 1350px;
            width: 100%;
            margin: 0 auto;
        }

        /* Executive Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: var(--shadow-card);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .stat-info h4 {
            font-size: 1.45rem;
            font-weight: 800;
            line-height: 1.2;
        }

        .stat-info p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Filter Pills */
        .filter-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .category-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .pill {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill:hover {
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        .pill.active {
            background-color: var(--accent-primary);
            color: #fff;
            border-color: var(--accent-primary);
        }

        /* Course Section */
        .course-block {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-card);
        }

        .course-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            padding-bottom: 1.2rem;
            margin-bottom: 1.4rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .course-title-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .course-avatar {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: rgba(99, 102, 241, 0.12);
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            border: 1px solid rgba(99, 102, 241, 0.25);
        }

        .course-meta h3 {
            font-size: 1.18rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .course-meta span.code-badge {
            font-size: 0.75rem;
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent-primary);
            padding: 3px 9px;
            border-radius: 6px;
            font-weight: 700;
        }

        .course-meta p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .course-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

            background: linear-gradient(135deg, var(--accent
