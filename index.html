            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --pdf-color: #ef4444;

            --ques-color: #a855f7;
        }

        * {

            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 2.2rem 1.5rem;
            text-align: center;
        }

        .header-content {
            max-width: 1150px;
            margin: 0 auto;
        }

        .badge-header {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 10px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        header h1 {
            font-size: 2.1rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .container {
            max-width: 1150px;
            margin: 1.8rem auto;
            padding: 0 1.5rem;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            background: var(--card-hover);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        /* Live Sync Box */
        .live-sync-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.25rem;
            margin-bottom: 2.5rem;
        }

        .live-sync-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-color);
        }

        .live-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #10b981;
        }

        .subfolder-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .sub-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 13px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.83rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .sub-btn:hover, .sub-btn.active {
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary);
            border-color: var(--primary);
        }

        .view-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .drive-iframe-wrap {
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            height: 360px;
        }

        .drive-iframe-wrap iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Search Box */
        .search-box {
            position: relative;
            margin-bottom: 1.8rem;
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-box input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        /* Course Grid */
        .course-section {
            margin-bottom: 2.8rem;
        }

        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 1.2rem;
        }

        .course-title {
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .course-code {
            background: rgba(129, 140, 248, 0.15);
            color: var(--secondary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 1.1rem;
        }

        .file-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .file-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
        }

        .file-top {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 1rem;
        }

        .file-icon {
            font-size: 1.6rem;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);

        .icon-pdf { color: var(--pdf-color); }

            font-weight: 600;

            font-size: 0.73rem;

            border-radius: 4px;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;

        .file-actions {
            padding-top: 10px;

            justify-content: space-between;
            align-items: center;

            font-size: 0.76rem;
            color: var(--text-muted);

            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .open-btn:hover {
            background: var(--primary);
            color: #0f172a;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            color: var(--text-muted);
            font-size: 0.88rem;

        let currentFolderId = '1kAVmMEKiiwi4JldUaAUIsykXA4IkzT9A';
        let currentViewMode = 'list';

        function updateSubfolderBar(courseKey) {
            const bar = document.getElementById('subfolderBar');
            const list = folderMap[courseKey] || folderMap['all'];
            bar.innerHTML = '';

            list.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = 'sub-btn' + (index === 0 ? ' active' : '');
                btn.innerHTML = `<i class="fa-regular fa-folder-open"></i> ${item.label}`;
                btn.onclick = () => {
                    document.querySelectorAll('#subfolderBar .sub-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadDriveFolder(item.id, item.label);
                };
                bar.appendChild(btn);
            });

            loadDriveFolder(list[0].id, list[0].label);
        }

        function loadDriveFolder(folderId, label) {
            currentFolderId = folderId;
            document.getElementById('liveFolderTitle').innerText = `Live Sync: ${label}`;
            document.getElementById('driveFrame').src = `https://drive.google.com/embeddedfolderview?id=${folderId}#${currentViewMode}`;
            document.getElementById('directDriveLink').href = `https://drive.google.com/drive/folders/${folderId}`;
        }

        function setViewMode(mode) {
            currentViewMode = mode;
            document.getElementById('listBtn').classList.toggle('active', mode === 'list');
            document.getElementById('gridBtn').classList.toggle('active', mode === 'grid');
            document.getElementById('driveFrame').src = `https://drive.google.com/embeddedfolderview?id=${currentFolderId}#${currentViewMode}`;
        }

        function selectCourse(courseCode, btnEl) {
            currentCourse = courseCode;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnEl.classList.add('active');
            updateSubfolderBar(courseCode);
            renderCourses(document.getElementById('searchInput').value);
        }

        function renderCourses(searchQuery = '') {
            const container = document.getElementById('coursesContainer');
            container.innerHTML = '';

            coursesData.forEach(course => {
                if (currentCourse !== 'all' && course.code !== currentCourse) return;

                const filteredFiles = course.files.filter(file =>
                    file.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    file.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    course.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    course.code.toLowerCase().includes(searchQuery.toLowerCase())
                );

                if (filteredFiles.length === 0) return;

                let cardsHTML = '';
                filteredFiles.forEach(file => {
                    cardsHTML += `
                        <div class="file-card">
                            <div class="file-top">
                                <div class="file-icon"><i class="fa-solid ${file.icon}"></i></div>
                                <div class="file-info">
                                    <h3>${file.name}</h3>
                                    <span class="category-tag">${file.category}</span>
                                </div>
                            </div>
                            <div class="file-actions">
                                <span class="file-type-label"><i class="fa-regular fa-file"></i> ${file.type}</span>
                                <a href="${file.url}" target="_blank" class="open-btn">
                                    Open File <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                </a>
                            </div>
                        </div>
                    `;
                });

                const section = document.createElement('div');
                section.className = 'course-section';
                section.innerHTML = `
                    <div class="course-header">
                        <div class="course-title">
                            <i class="fa-solid ${course.icon}" style="color: var(--primary);"></i>
                            ${course.title}
                        </div>
                        <span class="course-code">${course.code}</span>
                    </div>
                    <div class="grid">${cardsHTML}</div>
                `;
                container.appendChild(section);
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderCourses(e.target.value);
        });

        updateSubfolderBar('all');
        renderCourses();
    </script>
</body>
</html>
